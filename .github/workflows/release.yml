name: Release

# Pushing a tag such as v0.2.0 builds the signed release APK, with the speech
# and translation models bundled, and publishes it as a GitHub Release.
#
# Repository secrets:
#   EXAMIC_KEYSTORE_BASE64    the release keystore, base64-encoded
#   EXAMIC_KEYSTORE_PASSWORD  its store password
#   EXAMIC_KEY_ALIAS          the key alias
#   EXAMIC_KEY_PASSWORD       the key password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo install cargo-ndk --locked
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: android/.model-cache
          key: models-${{ hashFiles('android/models.properties') }}
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXAMIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::EXAMIC_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/examic-release.jks"
          echo "EXAMIC_KEYSTORE=$RUNNER_TEMP/examic-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          EXAMIC_KEYSTORE_PASSWORD: ${{ secrets.EXAMIC_KEYSTORE_PASSWORD }}
          EXAMIC_KEY_ALIAS: ${{ secrets.EXAMIC_KEY_ALIAS }}
          EXAMIC_KEY_PASSWORD: ${{ secrets.EXAMIC_KEY_PASSWORD }}
        run: ./gradlew -Pexamic.abis=arm64-v8a fetchModels testDebugUnitTest assembleRelease
      - name: Collect the APK
        id: apk
        run: |
          name="examic-${GITHUB_REF_NAME}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$name"
          if "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging "$name" | grep -q "android.permission.INTERNET"; then
            echo "::error::the APK asks for INTERNET"; exit 1
          fi
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(du -m "$name" | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          body: |
            Examic ${{ github.ref_name }}: an offline voice recorder for Android with on-device
            Russian transcription and Russian-to-English translation.

            **Install:** download `${{ steps.apk.outputs.name }}` (${{ steps.apk.outputs.size }} MB,
            arm64 phones, Android 10+) and open it on the phone. It bundles the speech and
            translation models; on first start they are unpacked once, which takes a moment.
            After that everything works in airplane mode: the app has no network permission.

            **New in this release**
            - Russian speech-to-text with GigaAM v3, live while recording or after it
            - Russian-to-English translation with Opus-MT
            - Photos during a recording, placed on its timeline
            - Export to Markdown (with photos as a .zip) and PDF
            - Recordings are stored as plain Ogg Opus files (encryption removed)

            **Models and licenses**
            - GigaAM v3 e2e CTC (Q8_0 GGUF by handy-computer), MIT
            - Helsinki-NLP opus-mt_tiny_rus-eng, Apache-2.0, converted to int8 ONNX
            - transcribe.cpp / ggml, MIT; ONNX Runtime, MIT; libopus, BSD-3-Clause

            Full notices: in the app (Library → ⋮ → Licenses) and in
            `android/app/src/main/assets/THIRD_PARTY_NOTICES.md`.
