[workspace]
resolver = "3"
members = [
    "core/crates/examic-audio",
    "core/crates/examic-db",
    "core/crates/examic-asr",
    "core/crates/examic-mt",
    "core/crates/examic-ffi",
    "core/tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
examic-audio = { path = "core/crates/examic-audio" }
examic-db = { path = "core/crates/examic-db" }
examic-asr = { path = "core/crates/examic-asr" }
examic-mt = { path = "core/crates/examic-mt" }

thiserror = "2"
log = "0.4"

[profile.release]
# The Rust in this workspace is small and dominated by DSP loops, so
# it is built for speed. `opt-level = "z"` would switch off loop vectorisation
# in exactly those loops and save only a few hundred KB.
opt-level = 3
lto = "fat"
codegen-units = 1
# Android Gradle strips the packaged .so itself; keeping the symbol table here
# lets the build produce native debug symbols for crash reports.
strip = "debuginfo"
# Deliberately left at the default `panic = "unwind"`: UniFFI turns a Rust panic
# into a Kotlin exception. With "abort", a bug anywhere in the core would kill
# the process, and with it a recording that is still in progress.
