[package]
name = "examic-db"
description = "SQLite store for recordings, bookmarks, speech intervals, transcripts and photos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `bundled` compiles SQLite from source (plain C, no CMake), so every target
# gets the same, recent SQLite: STRICT tables and RETURNING need 3.37+.
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror.workspace = true
