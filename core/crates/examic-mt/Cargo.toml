[package]
name = "examic-mt"
description = "Russian to English translation: Opus-MT (Marian) on ONNX Runtime, with a pure-Rust SentencePiece tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# ONNX Runtime is loaded at run time from libonnxruntime.so (on Android it
# comes from the onnxruntime-android AAR), so nothing is downloaded or linked
# at build time. Without this feature only the tokenizer is built.
native = ["dep:ort"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
serde_json = "1"
unicode-normalization = "0.1"
thiserror.workspace = true
log.workspace = true
